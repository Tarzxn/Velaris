services:
  - type: web
    name: velaris-ollama-cloud
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --worker-class gthread --threads 8 --timeout 420
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: OLLAMA_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
